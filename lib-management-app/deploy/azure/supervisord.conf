[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
loglevel=info
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:library-data-service]
command=python3 -m uvicorn src.main:app --host 0.0.0.0 --port 8001
directory=/app/services/library-data-service
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/log/library-data-service.log
stderr_logfile=/var/log/library-data-service.log
environment=PYTHONPATH="/app",DATABASE_URL="%(ENV_DATABASE_URL)s",INTERNAL_SERVICE_KEY="%(ENV_INTERNAL_SERVICE_KEY)s"

[program:scraper-service]
command=python3 -m uvicorn src.main:app --host 0.0.0.0 --port 8002
directory=/app/services/scraper-service
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/log/scraper-service.log
stderr_logfile=/var/log/scraper-service.log
environment=PYTHONPATH="/app",INTERNAL_SERVICE_KEY="%(ENV_INTERNAL_SERVICE_KEY)s"

[program:comparison-service]
command=python3 -m uvicorn src.main:app --host 0.0.0.0 --port 8003
directory=/app/services/comparison-service
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/log/comparison-service.log
stderr_logfile=/var/log/comparison-service.log
environment=PYTHONPATH="/app",INTERNAL_SERVICE_KEY="%(ENV_INTERNAL_SERVICE_KEY)s",LIBRARY_DATA_SERVICE_URL="http://localhost:8001",SCRAPER_SERVICE_URL="http://localhost:8002"

[program:recommendation-service]
command=python3 -m uvicorn src.main:app --host 0.0.0.0 --port 8004
directory=/app/services/recommendation-service
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/log/recommendation-service.log
stderr_logfile=/var/log/recommendation-service.log
environment=PYTHONPATH="/app",INTERNAL_SERVICE_KEY="%(ENV_INTERNAL_SERVICE_KEY)s",LIBRARY_DATA_SERVICE_URL="http://localhost:8001",COMPARISON_SERVICE_URL="http://localhost:8003",LLM_PROVIDER="%(ENV_LLM_PROVIDER)s",LLM_MODEL="%(ENV_LLM_MODEL)s",LLM_API_KEY="%(ENV_LLM_API_KEY)s"

[program:notification-service]
command=python3 -m uvicorn src.main:app --host 0.0.0.0 --port 8005
directory=/app/services/notification-service
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/log/notification-service.log
stderr_logfile=/var/log/notification-service.log
environment=PYTHONPATH="/app",INTERNAL_SERVICE_KEY="%(ENV_INTERNAL_SERVICE_KEY)s",SMTP_HOST="%(ENV_SMTP_HOST)s",SMTP_PORT="%(ENV_SMTP_PORT)s",SMTP_USERNAME="%(ENV_SMTP_USERNAME)s",SMTP_PASSWORD="%(ENV_SMTP_PASSWORD)s"

[program:scheduler-service]
command=python3 -m uvicorn src.main:app --host 0.0.0.0 --port 8006
directory=/app/services/scheduler-service
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/log/scheduler-service.log
stderr_logfile=/var/log/scheduler-service.log
environment=PYTHONPATH="/app",INTERNAL_SERVICE_KEY="%(ENV_INTERNAL_SERVICE_KEY)s",LIBRARY_DATA_SERVICE_URL="http://localhost:8001",SCRAPER_SERVICE_URL="http://localhost:8002",COMPARISON_SERVICE_URL="http://localhost:8003",RECOMMENDATION_SERVICE_URL="http://localhost:8004",NOTIFICATION_SERVICE_URL="http://localhost:8005",SCHEDULE_ENABLED="%(ENV_SCHEDULE_ENABLED)s"

[program:api-gateway]
command=python3 -m uvicorn src.main:app --host 0.0.0.0 --port 8000
directory=/app/services/api-gateway
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/log/api-gateway.log
stderr_logfile=/var/log/api-gateway.log
environment=PYTHONPATH="/app",DATABASE_URL="%(ENV_DATABASE_URL)s",JWT_SECRET_KEY="%(ENV_JWT_SECRET_KEY)s",JWT_EXPIRE_MINUTES="%(ENV_JWT_EXPIRE_MINUTES)s",INTERNAL_SERVICE_KEY="%(ENV_INTERNAL_SERVICE_KEY)s",LIBRARY_DATA_SERVICE_URL="http://localhost:8001",SCRAPER_SERVICE_URL="http://localhost:8002",COMPARISON_SERVICE_URL="http://localhost:8003",RECOMMENDATION_SERVICE_URL="http://localhost:8004",NOTIFICATION_SERVICE_URL="http://localhost:8005",SCHEDULER_SERVICE_URL="http://localhost:8006",DEFAULT_ADMIN_PASSWORD="%(ENV_DEFAULT_ADMIN_PASSWORD)s"
